name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, e.g. v1.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag format
        run: |
          python3 -c 'import os, re; assert re.fullmatch(r"v(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", os.environ["RELEASE_TAG"]), "Expected vMAJOR.MINOR.PATCH"'
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.12'
      - name: Require a merged release commit
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Check catalog JSON format
        run: uv run --no-project python tools/catalogs/format-catalogs.py --check
      - name: Test release packaging
        run: uv run --no-project python tests/python/test-release.py
      - name: Build production database
        run: uv run --no-project --with lupa==2.8 python tools/build/build-lua-database.py
      - name: Test addon
        run: uv run --no-project --with lupa==2.8 python tests/run-tests.py --unit-only
      - name: Test database contracts
        run: uv run --no-project --with lupa==2.8 python tests/python/test-lua-database.py
      - name: Build release ZIP and notes
        run: uv run --no-project python tools/release/build-release.py --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v7
        with:
          name: addon-${{ env.RELEASE_TAG }}
          path: |
            dist/*.zip
            dist/release-notes.md
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.zip dist/release-notes.md \
            --verify-tag --title "Forever Rosetta Stone $RELEASE_TAG" \
            --notes-file dist/release-notes.md
